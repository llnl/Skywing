<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Define positions for equilateral triangle -->
  <!-- Agent 0 (top) -->
  <circle cx="200" cy="80" r="55" fill="#FFE6E6" stroke="#CC6666" stroke-width="2"/>
  <text x="200" y="68" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Agent 0</text>
  <text x="200" y="86" text-anchor="middle" fill="#333" font-size="12">Port: 20000</text>
  <text x="200" y="103" text-anchor="middle" fill="#333" font-size="12">Value: 42</text>

  <!-- Agent 1 (bottom right) -->
  <circle cx="320" cy="280" r="55" fill="#E6F3FF" stroke="#6699CC" stroke-width="2"/>
  <text x="320" y="268" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Agent 1</text>
  <text x="320" y="286" text-anchor="middle" fill="#333" font-size="12">Port: 20001</text>
  <text x="320" y="303" text-anchor="middle" fill="#333" font-size="12">Value: 73</text>

  <!-- Agent 2 (bottom left) -->
  <circle cx="80" cy="280" r="55" fill="#E6FFE6" stroke="#66CC66" stroke-width="2"/>
  <text x="80" y="268" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">Agent 2</text>
  <text x="80" y="286" text-anchor="middle" fill="#333" font-size="12">Port: 20002</text>
  <text x="80" y="303" text-anchor="middle" fill="#333" font-size="12">Value: 15</text>

  <!-- Connections -->
  <line x1="240" y1="120" x2="280" y2="240" stroke="#666" stroke-width="3"/>
  <line x1="265" y1="280" x2="135" y2="280" stroke="#666" stroke-width="3"/>
  <line x1="120" y1="240" x2="160" y2="120" stroke="#666" stroke-width="3"/>
</svg>
