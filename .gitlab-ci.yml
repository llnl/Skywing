stages:
  - everything

.build-and-test:

  stage: everything

  tags: [quartz, batch]

  variables:
    LLNL_SLURM_SCHEDULER_PARAMETERS: "-N1 -t 10 -A shpshftr -p pbatch"
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 5

  script:
    - printenv > ${CI_PROJECT_DIR}/ci_environment.log
    - ${CI_PROJECT_DIR}/.gitlab/build-and-test.sh

  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/ci_environment.log"
      - "${CI_PROJECT_DIR}/configure-outerr.log"
      - "${CI_PROJECT_DIR}/build-outerr.log"
      - "${CI_PROJECT_DIR}/testing-outerr.log"
      - "${CI_PROJECT_DIR}/install-outerr.log"
    reports:
      junit: "${CI_PROJECT_DIR}/*junit.xml"

# Extra compilers may be added if you care.
gcc-10-3-1:
  variables:
    MODULES: "gcc/10.3.1-magic ninja/1.11.1 python/3.9.12 cmake/3.26.3"
    CXX_COMPILER: "g++"
  extends: .build-and-test

